    <!-- Lightbox Modal Overlay -->
    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog">
        <div class="lightbox-close-area"></div>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full size image view">
        </div>
        <button class="lightbox-close-btn" aria-label="Close Lightbox">&times;</button>
    </div>

    <!-- Native Lightweight Lightbox Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const galleryImages = document.querySelectorAll('.gallery-item img');
            const closeBtn = document.querySelector('.lightbox-close-btn');
            const closeArea = document.querySelector('.lightbox-close-area');

            // Open Lightbox
            galleryImages.forEach(img => {
                img.addEventListener('click', (e) => {
                    lightboxImg.src = img.src;
                    lightboxImg.alt = img.alt;
                    lightbox.classList.add('active');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden'; // Lock body scroll
                });
            });

            // Close Lightbox function
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImg.src = ''; // Flush image source to prevent visual flash next time
                document.body.style.overflow = ''; // Restore body scroll
            };

            // Close events
            closeBtn.addEventListener('click', closeLightbox);
            closeArea.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Keydown event (Escape key)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            });
        });
    </script>
